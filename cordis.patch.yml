# Host plugin: give every fresh subagent delegation that names no route the
# default route of the models checked in Settings.
#
# `source: settings` reads the `subagent-model-selection-settings` row. A
# delegation that names no route gets the first listed model (or
# `config.defaultModel`); a delegation that names `provider` or `model` itself is
# passed through untouched — the list decides a default, not a licence.
- insert:
    - id: subagent-pin
      name: '@local/dsh-subagent-pin'
      config:
        source: settings
