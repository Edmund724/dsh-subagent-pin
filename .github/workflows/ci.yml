# CI：装依赖，跑仓库里唯一的测试入口。
#
# `npm test` 是 `node --test "test/*.test.mjs"`（108 项）。它不启动 Harness、
# 不读活 Settings、不需要凭据，因此在普通 runner 上就能跑完。
#
# 现场核对另一半（`npm run verify -- --lead <会话日志>`）需要一次真实运行的
# 持久化日志，无法在这里跑；它的纯逻辑一半由 test/verify-session.test.mjs
# 覆盖，剩下的按 README「已验证」表人工执行。
#
# 矩阵取 engines 下限那一档（22）与当前 LTS（24），并同时跑 Windows：本插件
# 的证据工具、文档与现场核对流程都假定 Windows（README「已验证」里的
# PowerShell 步骤、%USERPROFILE%\.dsh 与 asar 内路径）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # 锁文件是权威：本地与 CI 都用 `ci`，不在这里改写 package-lock.json。
      - name: Install
        run: npm ci

      - name: Test
        run: npm test
